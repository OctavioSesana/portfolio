<section id="portfolio" class="projects-section">
  <div class="container">
    
    <div class="section-header">
      <h2>Mis Proyectos</h2>
      <p>Algunos de los proyectos en los que he trabajado recientemente</p>
    </div>

    <div class="projects-grid">
      
      <article class="project-card" *ngFor="let project of projects">
        <div class="card-image">
          <img [src]="project.image" [alt]="project.title">
        </div>

        <div class="card-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>

          <div class="tags-container">
            <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
          </div>

          <div class="card-actions">
            <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" class="btn btn-dark">
              <i class="fas fa-external-link-alt"></i> Ver Demo
            </a>
            
            <a *ngIf="project.codeUrl" [href]="project.codeUrl" target="_blank" class="btn btn-outline">
              <i class="fab fa-github"></i> Código
            </a>
          </div>
        </div>
      </article>

    </div>
  </div>
</section>
