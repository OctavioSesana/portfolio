<section id="portfolio" class="projects-section">
  <div class="projects-container">

    <div class="section-header">
      <span class="section-badge"><i class="fas fa-briefcase"></i> Portfolio</span>
      <h2 class="section-title">Proyectos <span class="gradient-text">Destacados</span></h2>
      <p class="section-desc">
        Una selección de mis trabajos más recientes. Cada proyecto es una pieza única de desarrollo.
      </p>
    </div>

    <!-- Proyecto featured (primero) -->
    <div class="project-featured" *ngIf="projects[0]">
      <div class="featured-image">
        <img [src]="projects[0].image" [alt]="projects[0].title">
        <div class="featured-overlay">
          <div class="featured-tags">
            <span class="tag" *ngFor="let tag of projects[0].tags">{{ tag }}</span>
          </div>
          <h3>{{ projects[0].title }}</h3>
          <p>{{ projects[0].description }}</p>
          <div class="featured-actions">
            <a *ngIf="projects[0].demoUrl" [href]="projects[0].demoUrl" target="_blank" class="btn-project-primary">
              Ver Proyecto <i class="fas fa-external-link-alt"></i>
            </a>
            <a *ngIf="projects[0].codeUrl" [href]="projects[0].codeUrl" target="_blank" class="btn-project-icon">
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Proyectos en grid -->
    <div class="projects-grid">
      <article class="project-card" *ngFor="let project of projects.slice(1)">
        <div class="card-image">
          <img [src]="project.image" [alt]="project.title">
          <div class="card-overlay">
            <div class="card-tags">
              <span class="tag" *ngFor="let tag of project.tags">{{ tag }}</span>
            </div>
          </div>
        </div>
        <div class="card-body">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="card-actions">
            <a *ngIf="project.demoUrl" [href]="project.demoUrl" target="_blank" class="btn-project-primary">
              Ver Proyecto <i class="fas fa-arrow-up-right-from-square"></i>
            </a>
            <a *ngIf="project.codeUrl" [href]="project.codeUrl" target="_blank" class="btn-project-icon">
              <i class="fab fa-github"></i>
            </a>
          </div>
        </div>
      </article>
    </div>

  </div>
</section>
