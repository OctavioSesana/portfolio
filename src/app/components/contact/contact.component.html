<section id="contact" class="contact-section">
  <div class="container">
    
    <div class="section-header">
      <h2>Contacto</h2>
      <p>¿Tienes un proyecto en mente? No dudes en contactarme.</p>
    </div>

    <div class="contact-grid">
      
      <div class="contact-info">
        <h3>Información de Contacto</h3>
        
        <div class="info-item">
          <div class="icon-box"><i class="fas fa-envelope"></i></div>
          <div>
            <span class="label">Email</span>
            <a href="mailto:octasesana@gmail.com" class="value">octasesana@gmail.com</a>
          </div>
        </div>

        <div class="info-item">
          <div class="icon-box"><i class="fas fa-map-marker-alt"></i></div>
          <div>
            <span class="label">Ubicación</span>
            <span class="value">Rosario, Argentina</span>
          </div>
        </div>

        <div class="availability-card">
          <h4>Disponibilidad</h4>
          <p>
            Actualmente disponible para proyectos freelance y oportunidades laborales part-time.
          </p>
        </div>
      </div>

      <div class="contact-form-wrapper">
        <h3>Envíame un Mensaje</h3>
        
        <form (ngSubmit)="submitForm()" class="contact-form">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" [(ngModel)]="formData.name" placeholder="Tu nombre" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="formData.email" placeholder="tu@email.com" required>
          </div>

          <div class="form-group">
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="4" [(ngModel)]="formData.message" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
          </div>

          <button type="submit" class="btn-submit">Enviar Mensaje</button>
        </form>
      </div>

    </div>
  </div>
</section>
