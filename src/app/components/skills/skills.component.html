<section id="about" class="about-section">
  <div class="about-container">

    <!-- Header -->
    <div class="section-header">
      <span class="section-badge"><i class="fas fa-star"></i> Sobre Mí</span>
      <h2 class="section-title">Creando Experiencias <span class="gradient-text">Digitales</span></h2>
      <p class="section-desc">
        Desarrollador Full Stack con pasión por transformar ideas complejas en
        <span class="highlight">interfaces elegantes</span> y <span class="highlight">experiencias memorables</span>.
      </p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card" *ngFor="let stat of stats">
        <span class="stat-number gradient-text">{{ stat.number }}</span>
        <span class="stat-label">{{ stat.label }}</span>
        <span class="stat-sub">{{ stat.sub }}</span>
      </div>
    </div>

    <!-- Skills cards -->
    <div class="skills-grid">
      <div class="skill-card" *ngFor="let skill of skills">
        <div class="skill-header">
          <div class="skill-icon" [style.background]="skill.iconBg">
            <i class="fas" [ngClass]="skill.icon"></i>
          </div>
          <div>
            <h3>{{ skill.title }}</h3>
            <div class="skill-divider" [style.background]="skill.dividerColor"></div>
          </div>
        </div>
        <div class="skill-tags">
          <span class="skill-tag" *ngFor="let tag of skill.tags">{{ tag }}</span>
        </div>
      </div>
    </div>

    <!-- Info personal -->
    <div class="info-card">
      <h3 class="info-title"><i class="fas fa-globe"></i> Información Personal</h3>
      <div class="info-grid">
        <div class="info-item" *ngFor="let info of personalInfo">
          <span class="info-label">{{ info.label }}</span>
          <span class="info-value"><span class="info-dot"></span>{{ info.value }}</span>
        </div>
      </div>
    </div>

  </div>
</section>
