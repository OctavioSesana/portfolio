#9ca3af;--text-muted:#6b7280;--font-display:"Syne", sans-serif;--font-body:"Space Grotesk", sans-serif;--radius-sm:8px;--radius-md:12px;--radius-lg:20px;--radius-xl:28px}html{scroll-behavior:smooth}body{background-color:var(--bg-primary);color:var(--text-primary);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}*{cursor:none!important}.cursor-dot{position:fixed;top:0;left:0;width:8px;height:8px;background:#e040fb;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .15s,height .15s,background .15s}.cursor-ring{position:fixed;top:0;left:0;width:36px;height:36px;border:1.5px solid rgba(168,85,247,.6);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width .2s,height .2s,border-color .2s,opacity .2s}</style><link rel="stylesheet" href="styles-3ZDHALF7.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-3ZDHALF7.css"></noscript></head>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<script>
  const dot  = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let ringX = 0, ringY = 0;
  let mouseX = 0, mouseY = 0;

  document.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    dot.style.left = mouseX + 'px';
    dot.style.top  = mouseY + 'px';
  });

  // El ring sigue con lag suave
  function animateRing() {
    ringX += (mouseX - ringX) * 0.12;
    ringY += (mouseY - ringY) * 0.12;
    ring.style.left = ringX + 'px';
    ring.style.top  = ringY + 'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();

  // Hover sobre interactivos
  const interactives = 'a, button, [class*="btn"], input, textarea';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(interactives)) {
      dot.classList.add('hovered');
      ring.classList.add('hovered');
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest(interactives)) {
      dot.classList.remove('hovered');
      ring.classList.remove('hovered');
    }
  });
</script>
